# Configuration d'internbot — entreprises vérifiées par `internbot --discover` le 2026-10-08.
# Aucun secret ici : le token Telegram et le chat_id passent par des variables d'environnement.

notifier:
  type: telegram            # telegram | console
  group_threshold: 10       # au-delà de N nouvelles offres dans un run : messages groupés
  disable_link_preview: true

filters:
  # Matching insensible à la casse et aux accents, par mot entier
  # (« intern » ne matche pas « internal » ; ajoutez « internship » explicitement).
  title_include: ["intern", "interns", "internship", "internships", "stage", "stagiaire", "co-op", "working student"]
  title_exclude: ["senior", "staff", "principal", "manager", "director", "high school"]
  locations_include: []     # vide = toutes ; ex: ["France", "Paris", "Remote", "Europe"]
  # Chine exclue (pays + grandes villes, certains sites n'affichent que la ville).
  # Une offre multi-lieux n'est retirée que si TOUS ses lieux sont exclus.
  locations_exclude: ["China", "Shanghai", "Beijing", "Shenzhen", "Hangzhou", "Guangzhou",
                      "Chengdu", "Suzhou", "Nanjing", "Wuhan", "Xian", "Xi an", "Tianjin"]
  keywords_any: ["software", "engineer", "engineering", "developer", "data", "ml",
                 "machine learning", "ai", "backend", "frontend", "full stack", "fullstack",
                 "research", "security", "infrastructure", "platform"]  # vide = pas de contrainte
  year_hint: ["2027"]
  # prefer  : écarte « Summer 2026 Intern » mais garde les titres sans année
  # require : exige l'année dans le titre ; off : ignore year_hint
  year_hint_mode: prefer

http:
  # Mettez un moyen de contact (ex: votre GitHub) : c'est la politesse attendue d'un robot.
  user_agent: "internbot/0.1 (personal internship alert bot; low-frequency polling; +https://github.com/MatisseGrl/internship-bot)"
  timeout_s: 20
  min_delay_s: 1.5          # délai minimal entre deux requêtes vers un même domaine (>= 1 s)
  max_retries: 3
  backoff_base_s: 2

alerts:
  failure_threshold: 3      # alerte Telegram si une entreprise échoue 3 runs d'affilée (0 = off)
  log_removed: true         # log des offres disparues

digest:
  enabled: false            # récapitulatif périodique
  every_days: 7


