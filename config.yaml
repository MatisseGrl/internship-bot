  #   Sites maison : endpoint JSON appelé par la page carrières elle-même
  - name: Amazon
    provider: custom_json
    url: https://www.amazon.jobs/en/search.json
    params: {base_query: intern, result_limit: "{limit}", offset: "{offset}", sort: recent}
    items_path: jobs
    total_path: hits
    page_size: 100
    max_pages: 15
    fields:
      id: id_icims
      title: title
      url: "https://www.amazon.jobs{job_path}"
      location: normalized_location
      date: posted_date
  - name: IBM
    provider: custom_json
    url: https://www-api.ibm.com/search/api/v2
    method: POST
    body:
      appId: careers
      scopes: [careers2]
      query: {bool: {must: [{term: {field_keyword_18: Internship}}]}}
      size: "{limit}"
      from: "{offset}"
      sort: [{_score: desc}]
      lang: zz
      localeSelector: {}
      p: 1
      _source: [_id, title, url, field_keyword_19]
    items_path: hits.hits
    total_path: hits.total.value
    page_size: 100
    max_pages: 10
    fields:
      id: _source.url
      title: _source.title
      url: _source.url
      location: _source.field_keyword_19
  - name: Atlassian
    provider: custom_json
    url: https://www.atlassian.com/endpoint/careers/listings
