    params: {keywords: intern, page: "{page}", limit: "{limit}"}
    items_path: jobs
    total_path: totalCount
    page_size: 100
    max_pages: 5
    fields:
      id: data.req_id
      title: data.title
      url: "https://careers.amd.com/careers-home/jobs/{data.slug}"
      location: data.full_location
      date: data.posted_date
