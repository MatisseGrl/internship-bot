  # search_text (défaut « intern ») est une recherche plein texte côté Workday : chez certaines
  # banques, « intern » ramène des centaines d'offres « International » (Citi : 2 000, le
  # plafond). Là où c'est marqué, « internship » ramène les mêmes stages en 10 à 30 fois moins
  # de pages (vérifié le 9 oct. 2026). Pas chez Deutsche Bank, où il en perdait.
