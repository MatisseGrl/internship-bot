# Notes par entreprise de la grille (notation/GRILLE.md) : Écosystème SF et Pont vers SF.
#
# eco  : Écosystème SF (1-5), section 3.3 de la grille. On juge la boîte, pas le poste.
# pont : Pont vers SF (1-4) quand le stage n'est PAS aux États-Unis, section 3.4. Un stage aux
#        US vaut toujours 5 (décidé offre par offre, avec la citation du lieu).
#
# Règles appliquées pour `pont` (grille 3.4, lue à la lettre) :
#   3 = entreprise américaine (siège aux US), ou bureau US significatif à SF / Bay Area, NYC
#       ou Seattle dans la même entreprise ;
#   2 = présence US ailleurs (Houston, Boston, Virginie…), récente, petite ou non confirmée ;
#   1 = aucune présence US trouvée.
#   4 n'est jamais donné ici : il faut une preuve propre à l'équipe du stage (citation de l'offre).
# Règle de départage : en cas d'hésitation, la note la plus basse (« hésitation N/N+1 »).
# Sources des recherches web : vérifiées le 9 octobre 2026.

